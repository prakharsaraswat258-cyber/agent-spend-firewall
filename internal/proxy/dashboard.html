<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pitstop</title>
<style>
:root{--bg:#fafaf8;--fg:#1c1c1a;--mute:#6b6b66;--line:#e2e2dc;--card:#fff;--amber:#b86e00;--amberbg:#fff4de;--ok:#1f7a4d;--bad:#b3261e;--bar:#e9e9e3}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecece8;--mute:#9a9a92;--line:#2c2c28;--card:#1e1e1b;--amber:#f0a030;--amberbg:#3a2a0e;--ok:#4cc38a;--bad:#ff7b72;--bar:#2c2c28}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px}
h1{font-size:20px;margin:0 0 14px}
.strip{display:flex;gap:24px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.strip b{font-size:20px;display:block}.mute{color:var(--mute)}
.banner{background:var(--amberbg);border:1px solid var(--amber);border-radius:8px;padding:14px;margin-bottom:16px}
.banner p{margin:4px 0}
button{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.go{background:var(--amber);border-color:var(--amber);color:#fff}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--mute);font-size:13px}
.bar{height:8px;background:var(--bar);border-radius:4px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--ok)}
.bar.warn i{background:var(--amber)}.bar.bad i{background:var(--bad)}
.chip{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--line)}
.chip.needs{background:var(--amberbg);border-color:var(--amber);color:var(--amber)}.chip.looping{color:var(--bad);border-color:var(--bad)}
tr.row{cursor:pointer}.detail td{background:var(--card);font-size:13px}
.empty{padding:28px 0;color:var(--mute)}code{font-family:ui-monospace,monospace}
@media(max-width:640px){.hide{display:none}}
</style></head><body><main>
<h1>Pitstop</h1>
<div class="strip" id="strip"></div>
<div id="cards"></div>
<table><thead><tr><th>Run</th><th class="hide">Repo</th><th>Steps</th><th>Money</th><th class="hide">Likely more</th><th>Status</th></tr></thead><tbody id="runs"></tbody></table>
<div class="empty" id="empty" hidden>No runs yet. Start the proxy, then run <code>pitstop run -- claude</code>.</div>
</main>
<script>
const H={headers:{'X-Pitstop':'1'}};
const usd=m=>'$'+(m/1e6).toFixed(2);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
let open=null;
async function answer(id,cont,add){
  await fetch('/pitstop/answer',{method:'POST',headers:{'X-Pitstop':'1','Content-Type':'application/json'},body:JSON.stringify({id,continue:cont,add_micro:add,channel:'dashboard'})});
  tick();
}
function bar(frac,cls){const b=el('div','bar '+cls),i=el('i');i.style.width=Math.min(100,Math.max(0,frac*100))+'%';b.append(i);return b}
async function tick(){
  let o;try{o=await (await fetch('/pitstop/overview',H)).json()}catch(e){return}
  const s=document.getElementById('strip');s.replaceChildren();
  for(const [l,v,c] of [['Today',o.day,o.dayCap],['This month',o.month,o.monthCap]]){
    const d=el('div');d.append(el('b','',usd(v)+(c?' / '+usd(c):'')),el('span','mute',l));s.append(d)}
  {const d=el('div');d.append(el('b','',o.accScored>=o.accMin?o.accHits+' of '+o.accScored:'–'),el('span','mute',o.accScored>=o.accMin?'forecasts right':'forecast accuracy after '+o.accMin+' finished runs'));s.append(d)}
  const cs=document.getElementById('cards');cs.replaceChildren();
  for(const c of o.cards||[]){
    const b=el('div','banner');
    b.append(el('b','','Needs your decision: '+c.Run));
    b.append(el('p','',c.Reason==='cap'?'Budget reached: '+usd(c.Spent)+' of '+usd(c.Budget)+' used.':
      c.Done+' of '+c.Total+' steps done, '+usd(c.Spent)+' of '+usd(c.Budget)+' used. Likely '+usd(c.P50)+' to '+usd(c.P90)+' more ('+c.Confidence+' confidence).'));
    const g=el('button','go','Continue +'+usd(c.Offer));g.onclick=()=>answer(c.ID,true,c.Offer);
    const x=el('button','','Stop & save');x.onclick=()=>answer(c.ID,false,0);
    b.append(g,document.createTextNode(' '),x);cs.append(b)}
  const tb=document.getElementById('runs');tb.replaceChildren();
  document.getElementById('empty').hidden=(o.runs||[]).length>0;
  for(const r of o.runs||[]){
    const tr=el('tr','row');tr.onclick=()=>{open=open===r.ID?null:r.ID;tick()};
    tr.append(el('td','',r.ID));tr.append(el('td','hide',r.Repo+(r.Branch?' @ '+r.Branch:'')));
    const st=el('td');st.append(r.Total?document.createTextNode(r.Done+'/'+r.Total+' '):el('span','mute','no plan'));if(r.Total)st.append(bar(r.Done/r.Total,''));tr.append(st);
    const m=el('td');m.append(document.createTextNode(usd(r.Spent)+(r.Budget?' / '+usd(r.Budget):'')));
    if(r.Budget){const f=r.Spent/r.Budget;m.append(bar(f,f>=1?'bad':f>=.7?'warn':''))}tr.append(m);
    tr.append(el('td','hide',r.Total?usd(r.P50)+'–'+usd(r.P90):'–'));
    const sc=el('td');sc.append(el('span','chip '+(r.Status==='needs you'?'needs':r.Status),r.Status));tr.append(sc);tb.append(tr);
    if(open===r.ID){
      const d=el('tr','detail'),td=el('td');td.colSpan=6;
      let cl=[];try{cl=await (await fetch('/pitstop/calls?run='+encodeURIComponent(r.ID),H)).json()||[]}catch(e){}
      td.append(el('div','mute',r.Calls+' calls, '+r.Loops+' loop alerts. Resume: pitstop resume '+r.ID));
      const t=el('table');
      for(const c of cl){const rw=el('tr');for(const x of [new Date(c.At*1000).toLocaleTimeString(),c.Model,c.Input+' in',c.Output+' out',c.CacheRead+' cache read',usd(c.CostMicro)])rw.append(el('td','',x));t.append(rw)}
      td.append(t);d.append(td);tb.append(d)}
  }
}
tick();setInterval(tick,3000);
</script></body></html>
