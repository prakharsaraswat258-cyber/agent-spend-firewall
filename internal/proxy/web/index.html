<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitstop</title>
<link rel="icon" href="/dashboard/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/dashboard/app.css">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="#/"><img src="/dashboard/favicon.svg" alt="" width="24" height="24">Pitstop</a>
    <nav aria-label="Screens">
      <a href="#/" data-nav="live">Live</a>
      <a href="#/history" data-nav="history">History</a>
    </nav>
    <span class="conn" id="conn" role="status" aria-live="polite">connecting…</span>

</header>
<main class="wrap" id="view" tabindex="-1"></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/dashboard/app.js"></script>
</body>
</html>
