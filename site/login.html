<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Pitstop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
<style>
  .auth { display: grid; grid-template-columns: 1fr 1fr; min-height: 100svh; }
  .side { background: var(--field-1); color: #fff; padding: 28px var(--m) 40px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
  .side .wordmark { color: #fff; }
  .side h1 { font-size: clamp(48px, 6vw, 96px); max-width: 7em; position: relative; z-index: 1; }
  .side p { margin-top: 20px; max-width: 34ch; color: #e6e6e6; position: relative; z-index: 1; }
  .side svg { position: absolute; left: 0; right: 0; bottom: 18%; width: 100%; height: 46%; }
  .side .line { fill: none; stroke: #fff; stroke-width: 3; stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 2.4s .3s cubic-bezier(.2,.7,.1,1) forwards; }
  .side .bud { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 10 8; }
  .side .stop { fill: var(--accent); transform-origin: 72% 50%; transform: scaleY(0); animation: grow .5s 2.5s cubic-bezier(.2,.7,.1,1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes grow { to { transform: scaleY(1); } }
  .formside { padding: 28px var(--m); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
  .formbox { width: 100%; max-width: 420px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); padding: 4px; gap: 4px; margin-bottom: 28px; }
  .tabs button { font: 600 16px var(--text); padding: 12px; border: 0; background: transparent; cursor: pointer; }
  .tabs button[aria-selected=true] { background: #fff; }
  .tabs button:hover { background: var(--surface-2); }
  .formbox h2 { font-size: clamp(32px, 3vw, 44px); margin-bottom: 8px; }
  .formbox .sub { color: var(--muted); margin-bottom: 24px; }
  .formbox label { display: block; font-size: 15px; font-weight: 600; margin: 16px 0 6px; }
  .formbox input { width: 100%; font: 500 17px var(--text); padding: 14px; border: 2px solid var(--surface-2); background: #fff; color: var(--ink); }
  .formbox input:focus { border-color: var(--ink); outline: 0; }
  .formbox .btn { width: 100%; justify-content: center; margin-top: 20px; padding: 16px; }
  .gh { background: var(--surface) !important; color: var(--ink) !important; margin-top: 10px !important; }
  .gh:hover { background: var(--surface-2) !important; }
  .msg { margin-top: 18px; padding: 16px; background: var(--surface); font-size: 16px; display: none; }
  .msg.show { display: block; }
  .msg code { font: 600 15px var(--text); }
  .back { margin-top: 28px; font-size: 15px; }
  .formbox > *, .side h1, .side p { animation: up .7s cubic-bezier(.2,.7,.1,1) both; }
  .formbox > :nth-child(2) { animation-delay: .08s; } .formbox > :nth-child(3) { animation-delay: .16s; } .side h1 { animation-delay: .1s; } .side p { animation-delay: .2s; }
  #f > * { animation: up .6s cubic-bezier(.2,.7,.1,1) both; } #f > :nth-child(2) { animation-delay: .1s } #f > :nth-child(3) { animation-delay: .15s } #f > :nth-child(4) { animation-delay: .2s } #f > :nth-child(5) { animation-delay: .25s } #f > :nth-child(6) { animation-delay: .3s } #f > :nth-child(7) { animation-delay: .35s }
  @keyframes up { from { opacity: 0; transform: translateY(24px); } }
  .btn:active { transform: translateY(2px) scale(.98); }
  @media (max-width: 860px) { .auth { grid-template-columns: 1fr; } .side { min-height: 54svh; } .side svg { bottom: 4%; height: 40%; } }
  @media (prefers-reduced-motion: reduce) { .formbox > *, #f > *, .side h1, .side p { animation: none; } .side .line { stroke-dashoffset: 0; } .side .stop { transform: none; } }
</style>
</head>
<body>
<main class="auth">
  <section class="side" aria-label="Pitstop">
    <a class="wordmark" href="index.html"><i></i>pitstop</a>
    <svg viewBox="0 0 1000 400" preserveAspectRatio="none" aria-hidden="true">
      <line class="bud" x1="0" x2="1000" y1="90" y2="90"/>
      <path class="line" d="M0 380 L80 370 L150 352 L230 340 L300 318 L360 300 L430 270 L500 246 L560 214 L620 182 L680 150 L720 128"/>
      <rect class="stop" x="716" y="40" width="10" height="320"/>
    </svg>
    <div>
      <h1>The team view is coming.</h1>
      <p>Shared runs, per-person budgets and approvals for leads. Your local Pitstop needs no account at all.</p>
    </div>
  </section>

  <section class="formside">
    <div class="formbox">
      <div class="tabs" role="tablist" aria-label="Account">
        <button role="tab" id="t-in" aria-selected="true" aria-controls="f">Sign in</button>
        <button role="tab" id="t-up" aria-selected="false" aria-controls="f">Join the list</button>
      </div>
      <form id="f" role="tabpanel" novalidate>
        <h2 id="f-h">Sign in to Team</h2>
        <p class="sub" id="f-sub">For teams on the hosted plan.</p>
        <label for="email">Work email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="you@company.com">
        <div id="pw-wrap">
          <label for="pw">Password</label>
          <input id="pw" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit" id="go">Sign in</button>
        <button class="btn gh" type="button" id="gh">Continue with GitHub</button>
        <div class="msg" id="msg" role="status"></div>
      </form>
      <p class="back"><a href="index.html">Back to Pitstop</a></p>
    </div>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const msg = $('msg');
  const say = (html) => { msg.innerHTML = html; msg.classList.add('show'); };
  const local = 'Run it locally now, no account: <code>pitstop init</code> then <code>pitstop run -- claude</code>.';
  function mode(up) {
    $('t-in').setAttribute('aria-selected', !up); $('t-up').setAttribute('aria-selected', up);
    $('f-h').textContent = up ? 'Join the Team list' : 'Sign in to Team';
    $('f-sub').textContent = up ? 'We will write once when the hosted plan opens.' : 'For teams on the hosted plan.';
    $('pw-wrap').hidden = up; $('pw').required = !up;
    $('go').textContent = up ? 'Email me when it opens' : 'Sign in';
    msg.classList.remove('show');
  }
  $('t-in').onclick = () => mode(false);
  $('t-up').onclick = () => mode(true);
  if (location.hash === '#signup') mode(true);
  // No backend yet: nothing typed here is sent or stored.
  $('f').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = $('email');
    if (!email.checkValidity()) { email.focus(); say('Enter a valid email address.'); return; }
    if ($('t-up').getAttribute('aria-selected') === 'true') {
      location.href = 'mailto:?subject=' + encodeURIComponent('Pitstop Team plan waitlist') + '&body=' + encodeURIComponent('Please add ' + email.value + ' to the Team plan list.');
      say('Your mail app should open with the request ready to send. ' + local);
    } else {
      say('The hosted Team plan is not open yet, so there are no accounts to sign in to. ' + local);
    }
  });
  $('gh').onclick = () => say('GitHub sign-in arrives with the hosted Team plan. ' + local);
})();
</script>
</body>
</html>
